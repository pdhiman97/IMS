<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Perspective Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
        }
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100px;
            opacity: 0;
            pointer-events: none;
        }
        #introScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease;
        }
        #introScreen h1 {
            font-weight: 400;
            font-size: 2rem;
            letter-spacing: 0.15em;
            margin-bottom: 16px;
        }
        #introScreen p {
            font-weight: 300;
            font-size: 0.95rem;
            color: #888;
            max-width: 380px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        #startButton {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 32px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #startButton:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div id="introScreen">
        <h1>PRESENCE</h1>
        <p>Step in front of the camera. Your attention collapses chaos into order.</p>
        <button id="startButton">ENTER</button>
    </div>

    <canvas id="particleCanvas"></canvas>
    <video id="videoFeed" autoplay playsinline></video>

    <script>
        // --- SETUP ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('videoFeed');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let isFaceDetected = false;
        let spherePoints3D = [];
        let noiseOffset = 0;
        let rotationAngle = 0;
        const NUM_PARTICLES = 1500;
        const NOISE_SCALE = 0.004;

        // Perlin noise implementation
        const PERLIN_YWRAPB = 4; const PERLIN_YWRAP = 1 << PERLIN_YWRAPB;
        const PERLIN_ZWRAPB = 8; const PERLIN_ZWRAP = 1 << PERLIN_ZWRAPB;
        const PERLIN_SIZE = 4095; let perlin;
        const noise = (x, y = 0, z = 0) => {
            if (perlin == null) {
                perlin = new Array(PERLIN_SIZE + 1);
                for (let i = 0; i < PERLIN_SIZE + 1; i++) { perlin[i] = Math.random(); }
            }
            if (x < 0) { x = -x; } if (y < 0) { y = -y; } if (z < 0) { z = -z; }
            let xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
            let xf = x - xi; let yf = y - yi; let zf = z - zi; let rxf, ryf;
            let r = 0; let ampl = 0.5;
            let n1, n2, n3;
            for (let o = 0; o < 4; o++) {
                let of = xi + (yi << PERLIN_YWRAPB) + (zi << PERLIN_ZWRAPB);
                rxf = (xf) => (xf * xf * (3 - 2 * xf)); ryf = (yf) => (yf * yf * (3 - 2 * yf));
                n1 = perlin[of & PERLIN_SIZE];
                n1 += rxf(xf) * (perlin[(of + 1) & PERLIN_SIZE] - n1);
                n2 = perlin[(of + PERLIN_YWRAP) & PERLIN_SIZE];
                n2 += rxf(xf) * (perlin[(of + PERLIN_YWRAP + 1) & PERLIN_SIZE] - n2);
                n1 += ryf(yf) * (n2 - n1);
                of += PERLIN_ZWRAP;
                n2 = perlin[of & PERLIN_SIZE];
                n2 += rxf(xf) * (perlin[(of + 1) & PERLIN_SIZE] - n2);
                n3 = perlin[(of + PERLIN_YWRAP) & PERLIN_SIZE];
                n3 += rxf(xf) * (perlin[(of + PERLIN_YWRAP + 1) & PERLIN_SIZE] - n3);
                n2 += ryf(yf) * (n3 - n2);
                n1 += (zf * zf * (3 - 2 * zf)) * (n2 - n1);
                r += n1 * ampl; ampl *= 0.5; xi <<= 1; xf *= 2; yi <<= 1; yf *= 2; zi <<= 1; zf *= 2;
                if (xf >= 1) { xi++; xf--; } if (yf >= 1) { yi++; yf--; } if (zf >= 1) { zi++; zf--; }
            }
            return r;
        };

        // --- PARTICLE CLASS ---
        class Particle {
            constructor() {
                this.pos = { x: Math.random() * canvas.width, y: Math.random() * canvas.height };
                this.vel = { x: 0, y: 0 };
                this.acc = { x: 0, y: 0 };
                this.target = { x: 0, y: 0 };
                this.maxSpeed = 15;
            }
            applyForce(force) { this.acc.x += force.x; this.acc.y += force.y; }
            flow() { const angle = noise(this.pos.x * NOISE_SCALE, this.pos.y * NOISE_SCALE, noiseOffset) * Math.PI * 4; const force = { x: Math.cos(angle) * 0.1, y: Math.sin(angle) * 0.1 }; this.applyForce(force); }
            seek() {
                const desiredX = this.target.x - this.pos.x;
                const desiredY = this.target.y - this.pos.y;
                const dist = Math.sqrt(desiredX * desiredX + desiredY * desiredY);
                let desiredMag = this.maxSpeed;
                if (dist < 100) { desiredMag = (dist / 100) * this.maxSpeed; }
                const desired = { x: (desiredX / dist) * desiredMag, y: (desiredY / dist) * desiredMag };
                const steer = { x: desired.x - this.vel.x, y: desired.y - this.vel.y };
                const steerMag = Math.sqrt(steer.x * steer.x + steer.y * steer.y);
                const steerForce = 3.0;
                if (steerMag > steerForce) {
                    steer.x = (steer.x / steerMag) * steerForce;
                    steer.y = (steer.y / steerMag) * steerForce;
                }
                this.applyForce(steer);
            }
            update() {
                this.vel.x += this.acc.x; this.vel.y += this.acc.y;
                const speed = Math.sqrt(this.vel.x * this.vel.x + this.vel.y * this.vel.y);
                if (speed > this.maxSpeed) { this.vel.x = (this.vel.x / speed) * this.maxSpeed; this.vel.y = (this.vel.y / speed) * this.maxSpeed; }
                this.pos.x += this.vel.x; this.pos.y += this.vel.y;
                this.acc = { x: 0, y: 0 };
            }
            edges() {
                if (this.pos.x > canvas.width) this.pos.x = 0;
                if (this.pos.x < 0) this.pos.x = canvas.width;
                if (this.pos.y > canvas.height) this.pos.y = 0;
                if (this.pos.y < 0) this.pos.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillRect(this.pos.x, this.pos.y, 1.5, 1.5);
            }
        }

        // --- INITIALIZATION & HELPER FUNCTIONS ---
        function initSpherePoints() {
            spherePoints3D = [];
            const goldenAngle = Math.PI * (3 - Math.sqrt(5));
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const y = 1 - (i / (NUM_PARTICLES - 1)) * 2;
                const radiusAtY = Math.sqrt(1 - y * y);
                const theta = goldenAngle * i;
                const x = Math.cos(theta) * radiusAtY;
                const z = Math.sin(theta) * radiusAtY;
                spherePoints3D.push({ x, y, z });
            }
        }
        
        function initParticles() {
            particles = [];
            for (let i = 0; i < NUM_PARTICLES; i++) {
                particles.push(new Particle());
            }
        }

        // --- FACE DETECTION ---
        async function setupFaceDetection() {
            if (!('FaceDetector' in window)) {
                alert('Face Detector API not supported by your browser.');
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                await video.play();
                const faceDetector = new FaceDetector({ fastMode: true });

                async function detect() {
                    const faces = await faceDetector.detect(video);
                    if (faces.length > 0) {
                        isFaceDetected = true;
                        const face = faces[0].boundingBox;
                        const faceCenterX = face.x + face.width / 2;
                        const targetAngle = (faceCenterX / canvas.width - 0.5) * (Math.PI / 2);
                        rotationAngle += (targetAngle - rotationAngle) * 0.1;
                    } else {
                        isFaceDetected = false;
                    }
                    requestAnimationFrame(detect);
                }
                detect();
            } catch (err) {
                console.error("Error accessing webcam:", err);
                alert("Could not access webcam.");
            }
        }

        // --- MAIN ANIMATION LOOP ---
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (isFaceDetected) {
                const cosA = Math.cos(rotationAngle);
                const sinA = Math.sin(rotationAngle);
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(canvas.width, canvas.height) * 0.4;
                
                for(let i = 0; i < particles.length; i++) {
                    const p3d = spherePoints3D[i];
                    const rotatedX = p3d.x * cosA - p3d.z * sinA;
                    const rotatedZ = p3d.x * sinA + p3d.z * cosA;
                    const scale = (rotatedZ + 2) / 3;
                    const projectedX = centerX + (rotatedX * radius * scale);
                    const projectedY = centerY + (p3d.y * radius * scale);
                    particles[i].target = { x: projectedX, y: projectedY };
                    const size = Math.max(0.5, 2 * scale);
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.2, scale)})`;
                    ctx.fillRect(particles[i].pos.x, particles[i].pos.y, size, size);
                }
            } else {
                 ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            }

            for (const p of particles) {
                if (isFaceDetected) {
                    p.seek();
                } else {
                    p.flow();
                }
                p.update();
                p.edges();
                if(!isFaceDetected) {
                   p.draw();
                }
            }
            noiseOffset += 0.005;

            requestAnimationFrame(animate);
        }

        // --- START ON USER INTERACTION ---
        document.getElementById('startButton').addEventListener('click', () => {
            const intro = document.getElementById('introScreen');
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
            }, 800);

            // Initialize and run application
            initSpherePoints();
            initParticles();
            setupFaceDetection();
            animate();
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initSpherePoints();
            initParticles();
        });
    </script>
</body>
</html>
